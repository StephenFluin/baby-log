<div class="main">
    <h2>Manage Types</h2>
    @if (userData.types(); as types) {
        <div>
            @for (keyValue of types; track keyValue.key) {
                <section>
                    <h3>
                        {{ keyValue.value.name }}
                        <button
                            type="button"
                            class="icon-circle"
                            [attr.aria-label]="'Delete ' + keyValue.value.name"
                            (click)="deleteType(keyValue.key, keyValue.value.name)"
                        >
                            <img src="/assets/images/baseline-delete_forever-24px.svg" alt="" />
                        </button>
                    </h3>
                    <div style="padding-left: 32px">
                        @for (detail of keyValue.value.details; track $index) {
                            <div>
                                {{ detail }}
                                <button
                                    type="button"
                                    class="icon-circle"
                                    [attr.aria-label]="'Delete ' + detail + ' from ' + keyValue.value.name"
                                    (click)="deleteDetail(keyValue.key, keyValue.value.details, detail)"
                                >
                                    <img src="/assets/images/baseline-delete_forever-24px.svg" alt="" />
                                </button>
                            </div>
                        }
                        <form (submit)="$event.preventDefault(); updateDetails(keyValue.key, keyValue.value.details, newDetail)">
                            <label [for]="'detail-' + keyValue.key">New {{ keyValue.value.name }} detail:</label>
                            <input [id]="'detail-' + keyValue.key" #newDetail type="text" />
                            <button type="submit">Add</button>
                        </form>
                    </div>
                </section>
            }
            <h3>New Type</h3>
            <form (submit)="$event.preventDefault(); addType(newType)">
                <label for="new-type">Add an activity type:</label>
                <input id="new-type" #newType type="text" />
                <button type="submit">Add</button>
            </form>
        </div>
    } @else {
        We couldn't load the type list.
    }
</div>
